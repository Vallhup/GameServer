syntax = "proto3";
package Protocol;

/* ----------------------------------- [ Attack ]  ----------------------------------- */

enum AttackInputType
{
	ATTACK_INPUT_LIGHT = 0;
	ATTACK_INPUT_HEAVY = 1;
}

/* ------------------------------------ [ Party ]  ------------------------------------ */

enum PartyLifecycle
{
	PARTY_LIFECYCLE_FORMING				= 0;
    PARTY_LIFECYCLE_WORLD_ENTRY_PENDING = 1;
    PARTY_LIFECYCLE_IN_WORLD			= 2;
    PARTY_LIFECYCLE_DISBANDED			= 3;
}

enum PartyMemberRole
{
	PARTY_MEMBER_ROLE_LEADER = 0;
	PARTY_MEMBER_ROLE_MEMBER = 1;
}

enum PartyMemberPresence
{
	PARTY_MEMBER_PRESENCE_ONLINE  = 0;
	PARTY_MEMBER_PRESENCE_OFFLINE = 1;
}

enum PartyJoinRequestState
{
	PARTY_JOIN_REQUEST_PENDING   = 0;
    PARTY_JOIN_REQUEST_ACCEPTED	 = 1;
    PARTY_JOIN_REQUEST_REJECTED	 = 2;
    PARTY_JOIN_REQUEST_CANCELLED = 3;
    PARTY_JOIN_REQUEST_EXPIRED	 = 4;
}

enum PartyJoinRequestCloseReason
{
	PARTY_CLOSE_NONE						 = 0;
    PARTY_CLOSE_ACCEPTED					 = 1;
    PARTY_CLOSE_REJECTED_BY_LEADER			 = 2;
    PARTY_CLOSE_CANCELLED_BY_REQUESTER		 = 3;
    PARTY_CLOSE_EXPIRED						 = 4;
    PARTY_CLOSE_PARTY_FULL					 = 5;
    PARTY_CLOSE_PARTY_ENTERED_WORLD			 = 6;
    PARTY_CLOSE_REQUESTER_JOINED_OTHER_PARTY = 7;
    PARTY_CLOSE_PARTY_DISBANDED				 = 8;
}

message PartyMember
{
	uint32 sessionId = 1;
	uint64 accountId = 2;
	uint64 netId = 3;
	uint32 characterType = 4;
	PartyMemberRole role = 5;
	PartyMemberPresence presence = 6;
}

message PartyJoinRequest
{
	uint64 joinRequestId = 1;
	uint64 partyId = 2;
	uint32 requesterSessionId = 3;
	uint64 requesterAccountId = 4;
	uint32 requesterCharacterType = 5;
	PartyJoinRequestState state = 6;
	PartyJoinRequestCloseReason closeReason = 7;
	double createdAtSec = 8;
	double expiresAtSec = 9;
	double closedAtSec = 10;
}

message PartySnapshot
{
	uint64 partyId = 1;
	PartyLifecycle lifecycle = 2;
	uint32 leaderSessionId = 3;
	repeated PartyMember members = 4;
	repeated PartyJoinRequest joinRequests = 5;
	double createdAtSec = 6;
	bool joinable = 7;
}

message PartyListEntry
{
	uint64 partyId = 1;
	uint32 leaderSessionId = 2;
	uint32 leaderCharacterType = 3;
	uint32 memberCount = 4;
	uint32 capacity = 5;
	PartyLifecycle lifecycle = 6;
	double createdAtSec = 7;
	bool joinable = 8;
}

/* ------------------------------- [ Boss Gimmick ]  ------------------------------- */

enum BossGimmickType
{
	BOSS_GIMMICK_TYPE_NONE = 0;
	BOSS_GIMMICK_TYPE_PHASE_TRANSITION_OBJECTS = 1;
	BOSS_GIMMICK_TYPE_FINAL_SAFE_ZONE = 2;
}

// 보스 기믹 진행 단계
//
// NONE:
//	- 진행 중인 기믹 없음
//
// TELEGRAPH:
//	- 기믹 예고 단계
//  - 아직 별도의 오브젝트, 생존 구역 X
//  - 우리 프로젝트의 경우 보스 몬스터가 뭐 기모으는 연출하기로 한거 
//    시작하는 트리거로 쓰면 될 듯
//
// ACTIVE:
//  - 기믹 수행 단계
//  - 클라이언트, 서버 동기화 된 오브젝트/구역 표시 및 상호작용 처리
//
// RESOLVE:
//  - 기믹 판정 단계
//  - 서버는 성공/실패 결과 적용
//  - 클라이언트는 판정, 종료 연출 진행
//
// COMPLETED:
//  - 기믹 완료
//  - 잔여 기믹 연출 정리
//
// CANCELLED:
//  - 기믹 중단
//  - 정상 판정 연출 없이 기믹 연출 정리
enum BossGimmickStage
{
	BOSS_GIMMICK_STAGE_NONE = 0;
	BOSS_GIMMICK_STAGE_TELEGRAPH = 1;
	BOSS_GIMMICK_STAGE_ACTIVE = 2;
	BOSS_GIMMICK_STAGE_RESOLVE = 3;
	BOSS_GIMMICK_STAGE_COMPLETED = 4;
	BOSS_GIMMICK_STAGE_CANCELLED = 5;
}

enum BossGimmickObjectState
{
    BOSS_GIMMICK_OBJECT_STATE_SPAWNED = 0;
    BOSS_GIMMICK_OBJECT_STATE_UPDATED = 1;
    BOSS_GIMMICK_OBJECT_STATE_BROKEN = 2;
    BOSS_GIMMICK_OBJECT_STATE_DESPAWNED = 3;
}